# ─────────────────────────────────────
# Database — MySQL
# ─────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
# update → Hibernate reads @Index annotations and creates indexes if missing

spring.jpa.show-sql=true
# show-sql=true lets you see the LIMIT/OFFSET queries in console — great for demos!

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ─────────────────────────────────────
# Caching — Caffeine (in-memory)
# ─────────────────────────────────────
spring.cache.type=caffeine

# Default spec: 500 max entries, expire after 10 min of no access
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=600s

# ─────────────────────────────────────
# Logging — see cache hits/misses
# ─────────────────────────────────────
logging.level.com.lms=INFO
logging.level.org.springframework.cache=DEBUG
# With DEBUG, console shows:
#   "Putting [Book#5] in cache 'books'"     ← cache miss, stored
#   "Getting [Book#5] from cache 'books'"   ← cache hit!
spring.thymeleaf.check-template-location=false
spring.jpa.open-in-view=false
# ─────────────────────────────────────
# Server
# ─────────────────────────────────────
server.port=8080
spring.application.name=LibraryManagementSystem
