<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LMS — Members</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
<div class="sidebar">
    <div class="sidebar-logo">
        <span class="logo-icon">📚</span>
        <div><div class="logo-title">LibraSystem</div><div class="logo-sub">LMS v1.0</div></div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">MAIN</div>
        <a th:href="@{/dashboard}" class="nav-item">🏠 Dashboard</a>
        <a th:href="@{/books}" class="nav-item">📚 Books</a>
        <a th:href="@{/borrow}" class="nav-item">🔄 Borrowing</a>
        <div class="nav-section">ADMIN</div>
        <a th:href="@{/members}" class="nav-item active">👥 Members</a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar">AD</div>
        <div class="user-info"><div class="user-name">Admin</div><div class="user-role">ADMIN</div></div>
        <a th:href="@{/logout}" class="logout-btn">⬅</a>
    </div>
</div>
<div class="main">
    <div class="topbar"><span class="page-title">Members</span></div>
    <div class="content">
        <div class="card">
            <div class="card-header"><h3>👥 Registered Members</h3></div>
            <table class="table">
                <thead>
                    <tr><th>#</th><th>Name</th><th>Email</th><th>Department</th><th>Student ID</th><th>Role</th></tr>
                </thead>
                <tbody>
                    <tr th:each="member : ${members}">
                        <td th:text="${member.id}">1</td>
                        <td><strong th:text="${member.name}">Name</strong></td>
                        <td th:text="${member.email}">email</td>
                        <td th:text="${member.department != null ? member.department : '—'}">Dept</td>
                        <td th:text="${member.studentId != null ? member.studentId : '—'}">STU-001</td>
                        <td>
                            <span th:class="${member.role.name() == 'ROLE_ADMIN' ? 'badge badge-purple' : 'badge badge-green'}"
                                  th:text="${member.role.name() == 'ROLE_ADMIN' ? 'ADMIN' : 'STUDENT'}">STUDENT</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
